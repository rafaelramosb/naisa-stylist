name: Android
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL de producción que abre la app (p. ej. https://naisa-stylist.vercel.app)"
        required: true
        default: "https://naisa-stylist.vercel.app"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Apuntar la app al dominio de producción
        env:
          APP_URL: ${{ inputs.app_url || vars.APP_URL || 'https://naisa-stylist.vercel.app' }}
        run: |
          HOST=$(echo "$APP_URL" | sed -E 's#https?://([^/]+).*#\1#')
          node -e "const f='capacitor.config.json';const c=require('./'+f);c.server.url=process.env.APP_URL.replace(/\/$/,'')+'/app';c.server.allowNavigation=[process.argv[1],'*.supabase.co'];require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "$HOST"
          sed -i "s#https://naisa-stylist.vercel.app#${APP_URL%/}#g" www/offline.html
      - run: npm ci
      - run: npx cap sync android
      - name: Firmar y compilar
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"; fi
          cd android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../naisa-stylist.apk
          cp app/build/outputs/bundle/release/app-release.aab ../naisa-stylist.aab
      - uses: actions/upload-artifact@v4
        with:
          name: naisa-stylist-android
          path: |
            mobile/naisa-stylist.apk
            mobile/naisa-stylist.aab
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/naisa-stylist.apk
            mobile/naisa-stylist.aab
